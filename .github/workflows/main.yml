name: Build Torvarcore Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Tools
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter google-genai pyinstaller

    - name: Build EXE
      run: |
        pyinstaller --noconsole --onefile app.pyw

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: Torvarcore-Desktop
        path: dist/app.exe
